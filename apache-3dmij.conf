# Add this inside the <VirtualHost *:443> block of 3dmij.nl-le-ssl.conf
# (after the CustomLog line, before the Include line)
#
# Enable proxy modules first: a2enmod proxy proxy_http
# Restart Apache after changes: systemctl reload apache2
#
# The 3D viewer will be at: https://3dmij.nl/models/

    # Proxy /models to the Node.js 3D viewer (port 3000)
    ProxyPreserveHost On
    RedirectMatch 301 ^/models$ /models/
    ProxyPass /models/ http://127.0.0.1:3000/
    ProxyPassReverse /models/ http://127.0.0.1:3000/
